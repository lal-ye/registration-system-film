[package]
name = "registration-system-film"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fframes = { version = "=1.2.0", features = ["compile-time-svgtree", "cli"] }

[target.'cfg(not(windows))'.dependencies]
fframes = { version = "=1.2.0", features = ["h264", "libav-agree-gpl"] }

[lib]
name = "registration_system_film"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "registration-system-film"
path = "src/main.rs"

[workspace]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

